name: Create pull request

inputs:
  next_version:
    required: true
  notes:
    required: true
  previous_version:
    required: true
  release:
    required: true

runs:
  using: "composite"
  steps:
    - run: |
        echo "Starting script execution..."
        header_prefix="##"  # Default assuming non-patch release
        if [[ "${{ inputs.release }}" == "patch" ]]; then
          header_prefix="###"
        fi
        echo "Header Prefix: $header_prefix"
  
        echo -e "# Changelog\n" > NEXT.md
        echo -e "All notable changes to this project will be documented in this file. See [standard-version](${{ github.server_url }}/conventional-changelog/standard-version) for commit guidelines.\n" >> NEXT.md
        date_cmd=$(date +'%Y-%m-%d')
        echo "Date Command Output: $date_cmd"
        
        echo -e "$header_prefix [${{ inputs.next_version }}](${{ github.server_url }}/${{ github.repository }}/compare/${{ inputs.previous_version }}...v${{ inputs.next_version }}) ($date_cmd)\n" >> NEXT.md
        echo -e "${{ inputs.notes }}\n" >> NEXT.md
        
        echo "Attempting to update CHANGELOG.md..."
        cat CHANGELOG.md | sed -e '1,4d' >> NEXT.md
        mv NEXT.md CHANGELOG.md
        echo "Script execution completed."
      shell: bash

    - id: commit
      uses: pr-mpt/actions-commit-hash@v3

    - uses: peter-evans/create-pull-request@v6
      with:
        title: Release ${{ inputs.next_version }}
        body: |
          ## Release [${{ inputs.next_version }}](${{ github.server_url }}/${{ github.repository }}/compare/${{ inputs.previous_version }}...${{ steps.commit.outputs.short }})

          ${{ inputs.notes }}
        author: GitHub <noreply@github.com>
        branch: release
        committer: GitHub <noreply@github.com>
        commit-message: |
          chore(release): ${{ inputs.next_version }}
        delete-branch: true
